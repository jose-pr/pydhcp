name: test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string
      run_benchmarks:
        description: Run the benchmark harness
        required: false
        type: boolean
        default: false
      result_name:
        description: Stem of the benchmark result file (default is named for the version and interpreter)
        required: false
        type: string
  push:
    # Only the default branch and throwaway ci-* tags. '**' ran the full
    # 8-job matrix on every push to every topic branch, duplicating the
    # pull_request run for the same commits; a ci-* tag is the documented way
    # to exercise a branch on demand.
    branches:
      - main
    tags:
      - ci-*
  pull_request:

# Least privilege: nothing here writes to the repo. Stated explicitly so the
# default token scope cannot widen it, matching docs.yml and release.yml.
permissions:
  contents: read

# Supersede in-flight runs for the same ref -- pushing a fixup should not leave
# the previous matrix burning runners. Keyed on ref, so tags and branches never
# cancel each other.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, and an audit of the dependencies the project installs. Type
  # checking is in the matrix below, on every platform it runs on.
  lint:
    name: Format and audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Temporary: netimps 0.4.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed first, from its branch, so the project install below finds
      # the requirement already met. Remove this step once 0.4.0 is published.
      - name: Install netimps 0.4.0 from its branch (until it is on PyPI)
        run: python -m pip install "netimps @ git+https://github.com/jose-pr/netimps@standard-alignment"

      # Temporary: pktcap 0.1.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed after netimps because its own requirement is that
      # unpublished netimps. Remove this step once 0.1.0 is published.
      - name: Install pktcap 0.1.0 from its branch (until it is on PyPI)
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Check formatting (black)
        run: python -m black --check src tests benchmarks examples

      # What this environment holds, the project's dependencies and the tooling
      # beside them. The project itself is not on PyPI under this checkout, and
      # the two dependencies installed from branches above are audited only once
      # they are published.
      - name: Audit the installed dependencies for known vulnerabilities
        run: python -m pip_audit --skip-editable

  test:
    # Windows is not a nicety here. Every platform-divergent defect this repo has
    # hit -- a broadcast POSIX refuses from a loopback-bound socket, the
    # IP_PKTINFO receive path, os.path.splitdrive being a no-op off Windows,
    # asyncio's proactor loop having no add_reader -- passed on one OS and failed
    # on the other. A single-OS matrix cannot see any of them.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The floor and the newest, where platform and version interact; the
          # versions in between add little that Linux is not already covering.
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          # macOS used to run only in the release workflow, which meant its
          # first run was against a pushed tag. That is exactly what happened
          # for v0.6.0: three tests failed there on BSD socket semantics Linux
          # and Windows do not share -- only 127.0.0.1 is aliased onto lo0, and
          # SO_REUSEADDR alone does not let two UDP sockets share a port -- and
          # the release stopped at the test gate. A platform whose first signal
          # arrives at release time is not in the matrix in any useful sense.
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Temporary: netimps 0.4.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed first, from its branch, so the project install below finds
      # the requirement already met. Remove this step once 0.4.0 is published.
      - name: Install netimps 0.4.0 from its branch (until it is on PyPI)
        run: python -m pip install "netimps @ git+https://github.com/jose-pr/netimps@standard-alignment"

      # Temporary: pktcap 0.1.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed after netimps because its own requirement is that
      # unpublished netimps. Remove this step once 0.1.0 is published.
      - name: Install pktcap 0.1.0 from its branch (until it is on PyPI)
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,docs]

      # A hosted macOS runner is disposable, so it can be given the loopback
      # addresses the tests that reply from, or to, an address other than
      # 127.0.0.1 look for (a BSD aliases only 127.0.0.1 onto lo0): without them
      # those tests skip and no BSD network stack ever runs them.
      - name: Alias the loopback addresses the tests use
        if: runner.os == 'macOS'
        run: |
          for address in 127.0.0.2 127.0.0.3 127.0.0.50; do
            sudo ifconfig lo0 alias "$address" up
          done
          ifconfig lo0

      - name: Run tests
        run: python -m pytest tests -q -rs

      # Deliberately on BOTH platforms: typeshed marks POSIX-only socket calls
      # unavailable on Windows, so `sock.recvmsg(...)` is an attr-defined error
      # on one platform while a `# type: ignore` for it is an unused-ignore
      # error on the other. Only checking both catches that.
      - name: Type-check (mypy strict)
        if: matrix.python-version == '3.14'
        run: python -m mypy src

      # Once, on the newest interpreter: the documentation toolchain supports
      # fewer interpreters than the package does.
      - name: Build docs
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        run: python -m mkdocs build --strict

  # The declared floors, exercised: every runtime dependency and feature extra
  # installed AT the lower bound pyproject.toml declares (`>=X.Y.0` -> `==X.Y.0`),
  # on the oldest supported Python. The matrix above only ever gets the newest
  # releases, so a floor that no longer works would otherwise go unnoticed.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      # Temporary: netimps 0.4.0, which pyproject.toml requires, is not on PyPI
      # yet, so it has no version to pin and comes from its branch. Remove this
      # step once 0.4.0 is published (the pin below then covers it).
      - name: Install netimps 0.4.0 from its branch (until it is on PyPI)
        run: python -m pip install "netimps @ git+https://github.com/jose-pr/netimps@standard-alignment"

      # Temporary: pktcap 0.1.0, likewise. Installed after netimps because its
      # own requirement is that unpublished netimps. Remove this step once 0.1.0
      # is published.
      - name: Install pktcap 0.1.0 from its branch (until it is on PyPI)
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"

      # The script reads the floors from pyproject.toml, evaluating each marker
      # for this runner, so a floor that differs by platform or Python is the one
      # that applies here. The two skipped names have no published version to pin;
      # drop --skip once both are on PyPI.
      - name: Pin every declared dependency to its floor
        run: python .github/pin_floors.py --skip netimps pktcap

      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q -rs

  # What a user gets from `pip install pydhcp` with no extra: the library imports
  # and loads no optional module, the command says it needs the `cli` extra, and
  # a feature that needs the yaml or toml extra names it. Then the `cli` extra
  # alone: the command runs. The test jobs above always have every extra.
  bare:
    name: Bare install (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Temporary: netimps 0.4.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed first, from its branch, so the project install below finds
      # the requirement already met. Remove this step once 0.4.0 is published.
      - name: Install netimps 0.4.0 from its branch (until it is on PyPI)
        run: python -m pip install "netimps @ git+https://github.com/jose-pr/netimps@standard-alignment"

      # Temporary: pktcap 0.1.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed after netimps because its own requirement is that
      # unpublished netimps. Remove this step once 0.1.0 is published.
      - name: Install pktcap 0.1.0 from its branch (until it is on PyPI)
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"

      - name: Install with no extra
        run: python -m pip install .

      - name: The library imports with no optional module, and the command names its extra
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import sys

          import pydhcp
          import pydhcp.cli

          optional = ("duho", "yaml", "tomli", "tomli_w", "tomllib")
          loaded = sorted(m for m in sys.modules if m.split(".")[0] in optional)
          assert loaded == [], loaded
          for name in ("duho", "yaml", "tomli_w"):
              try:
                  __import__(name)
              except ImportError:
                  continue
              raise SystemExit(name + " is installed in a bare environment")

          message = pydhcp.DHCPMessage.from_mapping(
              {
                  "op": "BOOTREQUEST", "htype": "ETHERNET", "hlen": 6, "hops": 0,
                  "xid": 1, "secs": 0, "flags": "BROADCAST", "ciaddr": "0.0.0.0",
                  "yiaddr": "0.0.0.0", "siaddr": "0.0.0.0", "giaddr": "0.0.0.0",
                  "chaddr": "00:11:22:33:44:55", "sname": "", "file": "", "options": {},
              }
          )
          assert message.to_text("json") and message.to_text("ini")
          for fmt in ("yaml", "toml"):
              try:
                  message.to_text(fmt)
              except ImportError as error:
                  assert 'pip install "pydhcp[%s]"' % fmt in str(error), error
                  print(fmt, "without the extra says:", error)
              else:
                  raise SystemExit(fmt + " was written without its extra")
          PY
          for run in "pydhcp --help" "python -m pydhcp --help"; do
            if $run > out.txt 2> err.txt; then
              echo "'$run' ran without the cli extra"; exit 1
            fi
            cat err.txt
            test ! -s out.txt
            grep -q 'pip install "pydhcp\[cli\]"' err.txt
          done

      - name: Add the cli extra alone
        run: python -m pip install ".[cli]"

      - name: The command runs, and the other extras are still named
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          pydhcp --version
          pydhcp interfaces > /dev/null
          if echo 00 | pydhcp packet --decode > /dev/null 2> err.txt; then
            echo "a malformed packet decoded"; exit 1
          fi
          cat err.txt
          grep -q "cannot process the packet" err.txt
          if python -c "import yaml" 2> /dev/null; then
            echo "yaml is installed without its extra"; exit 1
          fi
          if echo "op: BOOTREQUEST" | pydhcp packet --encode --format yaml > /dev/null 2> err.txt; then
            echo "yaml decoded without its extra"; exit 1
          fi
          cat err.txt
          grep -q 'pip install "pydhcp\[yaml\]"' err.txt

  # What a user installs is the built wheel, not the checkout: build it, install
  # it into a clean environment away from the source tree, run the console
  # script, and check it ships the files it must, on each OS.
  wheel:
    name: Built wheel and console script (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "${{ runner.temp }}/dist"

      # Temporary: netimps 0.4.0 and pktcap 0.1.0, which the wheel requires, are
      # not on PyPI yet. Installed into the fresh environment first, from their
      # branches, so the wheel install finds the requirements already met. Remove
      # this step once both are published.
      - name: Install netimps and pktcap from their branches (until they are on PyPI)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          if [ -d wheel-env/Scripts ]; then BIN=wheel-env/Scripts; else BIN=wheel-env/bin; fi
          "$BIN/python" -m pip install "netimps @ git+https://github.com/jose-pr/netimps@standard-alignment"
          "$BIN/python" -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"

      - name: Install the wheel, away from the checkout, and run the command
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          if [ -d wheel-env/Scripts ]; then BIN=wheel-env/Scripts; else BIN=wheel-env/bin; fi
          "$BIN/python" -m pip install "$(ls dist/*.whl)[cli]"
          "$BIN/pydhcp" --version
          "$BIN/pydhcp" interfaces > /dev/null
          "$BIN/python" - <<'PY'
          from importlib.resources import files

          import pydhcp

          root = files("pydhcp")
          for name in ("py.typed", "AGENTS.md", "README.md"):
              assert (root / name).is_file(), "the wheel does not ship %s" % name
          # Every header the top one lists is in the wheel too.
          import re
          listed = re.findall(r"^\| `pydhcp/([\w/]*AGENTS\.md)` \|", (root / "AGENTS.md").read_text(encoding="utf-8"), re.M)
          assert len(listed) >= 9, listed
          for name in listed:
              assert root.joinpath(*name.split("/")).is_file(), "the wheel does not ship %s" % name
          assert "site-packages" in pydhcp.__file__, pydhcp.__file__
          print("ok:", pydhcp.__file__)
          PY

  # The delivery path -- which interface a reply leaves by, what a stock client
  # does with it -- can only be judged against real peers on real links, so this
  # job runs ISC dhclient, BusyBox udhcpc and dnsmasq against the server, relay
  # and client over veth pairs in network namespaces. Everything happens in
  # namespaces the tests create and remove; the runner's own interfaces are not
  # touched. PYDHCP_INTEROP_REQUIRE makes a missing peer, or a runner that
  # refuses `ip netns` under sudo, a failure rather than a green run of skips.
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Temporary: netimps 0.4.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed first, from its branch, so the project install below finds
      # the requirement already met. Remove this step once 0.4.0 is published.
      - name: Install netimps 0.4.0 from its branch (until it is on PyPI)
        run: python -m pip install "netimps @ git+https://github.com/jose-pr/netimps@standard-alignment"

      # Temporary: pktcap 0.1.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed after netimps because its own requirement is that
      # unpublished netimps. Remove this step once 0.1.0 is published.
      - name: Install pktcap 0.1.0 from its branch (until it is on PyPI)
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      # dnsmasq-base is the daemon without its system service, which would
      # otherwise start on the runner and bind ports 53 and 67.
      - name: Install the peers
        run: |
          sudo apt-get update
          sudo apt-get install -y isc-dhcp-client dnsmasq-base busybox

      # Ubuntu confines dhclient and dnsmasq with AppArmor profiles written for
      # the system services, which do not allow the temporary directory the
      # tests give them for lease, pid and log files.
      - name: Unload the peers' AppArmor profiles
        run: |
          for profile in sbin.dhclient usr.sbin.dnsmasq; do
            if [ -e "/etc/apparmor.d/$profile" ]; then
              sudo apparmor_parser -R "/etc/apparmor.d/$profile" || true
            fi
          done

      - name: Check the runner can run the lab
        run: |
          command -v dhclient dnsmasq busybox
          busybox --list | grep -x udhcpc
          sudo ip netns add pydhcp-probe
          sudo ip netns exec pydhcp-probe ip link set lo up
          sudo ip netns del pydhcp-probe
          ip netns list

      - name: Run the interoperability tests
        env:
          PYDHCP_INTEROP_REQUIRE: "1"
          PYDHCP_INTEROP_LOGS: ${{ runner.temp }}/interop-logs
        run: sudo --preserve-env "$(command -v python)" -m pytest tests/interop -q -rsx -p no:cacheprovider

      # Plays every conformance case against the runner's dnsmasq and dhclient and
      # compares with the recorded goldens, writing nothing. The runner's packages
      # are another distribution's than the recording's, so a difference from a
      # golden is printed as a line of the report and passes; only a recorder that
      # cannot run the lab or play a case (status 2) fails the job.
      # The directory is root's by then (the tests before this ran as root), so the
      # report is written as root too.
      - name: Check the recorder against the runner's peers
        env:
          PYDHCP_INTEROP_REQUIRE: "1"
          PYDHCP_INTEROP_LOGS: ${{ runner.temp }}/interop-logs
        run: |
          set -o pipefail
          sudo mkdir -p "$PYDHCP_INTEROP_LOGS"
          sudo --preserve-env "$(command -v python)" tests/conformance/record.py --check | sudo tee "$PYDHCP_INTEROP_LOGS/conformance-check.txt"

      - name: No namespace left behind
        if: always()
        run: |
          test -z "$(ip netns list)"

      # The tests run as root and the peers write their own files, some of
      # them unreadable to the runner's user, which is who uploads.
      - name: Make the logs readable
        if: always()
        run: sudo chmod -R a+rX "${{ runner.temp }}/interop-logs" || true

      - name: Upload what each scenario saw
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs
          path: ${{ runner.temp }}/interop-logs
          if-no-files-found: warn

  benchmark:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_benchmarks) ||
      startsWith(github.ref, 'refs/tags/ci-bench-')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Temporary: netimps 0.4.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed first, from its branch, so the project install below finds
      # the requirement already met. Remove this step once 0.4.0 is published.
      - name: Install netimps 0.4.0 from its branch (until it is on PyPI)
        run: python -m pip install "netimps @ git+https://github.com/jose-pr/netimps@standard-alignment"

      # Temporary: pktcap 0.1.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed after netimps because its own requirement is that
      # unpublished netimps. Remove this step once 0.1.0 is published.
      - name: Install pktcap 0.1.0 from its branch (until it is on PyPI)
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      # --save writes benchmarks/results/<name>.json in the schema
      # tools/compare_bench.py consumes. CI is the only place perf numbers are
      # decision-grade, so this is what a committed baseline should come from.
      # The name reaches the shell as data, never spliced into its source.
      - name: Run benchmarks
        env:
          RESULT_NAME: ${{ inputs.result_name }}
        run: python benchmarks/run.py --save ${RESULT_NAME:+--name "$RESULT_NAME"}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmarks/results/*.json
