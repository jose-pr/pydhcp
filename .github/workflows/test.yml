name: test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string
      run_benchmarks:
        description: Run the benchmark harness
        required: false
        type: boolean
        default: false
  push:
    # Only the default branch and throwaway ci-* tags. '**' ran the full
    # 8-job matrix on every push to every topic branch, duplicating the
    # pull_request run for the same commits; a ci-* tag is the documented way
    # to exercise a branch on demand.
    branches:
      - main
    tags:
      - ci-*
  pull_request:

# Least privilege: nothing here writes to the repo. Stated explicitly so the
# default token scope cannot widen it, matching docs.yml and release.yml.
permissions:
  contents: read

# Supersede in-flight runs for the same ref -- pushing a fixup should not leave
# the previous matrix burning runners. Keyed on ref, so tags and branches never
# cancel each other.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows is not a nicety here. Every platform-divergent defect this repo has
    # hit -- a broadcast POSIX refuses from a loopback-bound socket, the
    # IP_PKTINFO receive path, os.path.splitdrive being a no-op off Windows,
    # asyncio's proactor loop having no add_reader -- passed on one OS and failed
    # on the other. A single-OS matrix cannot see any of them.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The floor and the newest, where platform and version interact; the
          # versions in between add little that Linux is not already covering.
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,docs,toml]

      - name: Run tests
        run: python -m pytest tests -q -rs

      - name: Check formatting (black)
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        run: python -m black --check src tests benchmarks examples

      # Deliberately on BOTH platforms: typeshed marks POSIX-only socket calls
      # unavailable on Windows, so `sock.recvmsg(...)` is an attr-defined error
      # on one platform while a `# type: ignore` for it is an unused-ignore
      # error on the other. Only checking both catches that.
      - name: Type-check (mypy strict)
        if: matrix.python-version == '3.14'
        run: python -m mypy src

      - name: Build docs
        if: matrix.os == 'ubuntu-latest'
        run: python -m mkdocs build --strict

  benchmark:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_benchmarks) ||
      startsWith(github.ref, 'refs/tags/ci-bench-')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      # --save writes benchmarks/results/<name>.json in the schema
      # tools/compare_bench.py consumes. CI is the only place perf numbers are
      # decision-grade, so this is what a committed baseline should come from.
      - name: Run benchmarks
        run: python benchmarks/run.py --save

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/*.json
