name: test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string
      run_benchmarks:
        description: Run the benchmark harness
        required: false
        type: boolean
        default: false
  push:
    # Only the default branch and throwaway ci-* tags. '**' ran the full
    # 8-job matrix on every push to every topic branch, duplicating the
    # pull_request run for the same commits; a ci-* tag is the documented way
    # to exercise a branch on demand.
    branches:
      - main
    tags:
      - ci-*
  pull_request:

# Least privilege: nothing here writes to the repo. Stated explicitly so the
# default token scope cannot widen it, matching docs.yml and release.yml.
permissions:
  contents: read

# Supersede in-flight runs for the same ref -- pushing a fixup should not leave
# the previous matrix burning runners. Keyed on ref, so tags and branches never
# cancel each other.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows is not a nicety here. Every platform-divergent defect this repo has
    # hit -- a broadcast POSIX refuses from a loopback-bound socket, the
    # IP_PKTINFO receive path, os.path.splitdrive being a no-op off Windows,
    # asyncio's proactor loop having no add_reader -- passed on one OS and failed
    # on the other. A single-OS matrix cannot see any of them.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The floor and the newest, where platform and version interact; the
          # versions in between add little that Linux is not already covering.
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          # macOS used to run only in the release workflow, which meant its
          # first run was against a pushed tag. That is exactly what happened
          # for v0.6.0: three tests failed there on BSD socket semantics Linux
          # and Windows do not share -- only 127.0.0.1 is aliased onto lo0, and
          # SO_REUSEADDR alone does not let two UDP sockets share a port -- and
          # the release stopped at the test gate. A platform whose first signal
          # arrives at release time is not in the matrix in any useful sense.
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Temporary: netimps 0.4.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed first, from its branch, so the project install below finds
      # the requirement already met. Remove this step once 0.4.0 is published.
      - name: Install netimps 0.4.0 from its branch (until it is on PyPI)
        run: python -m pip install "netimps @ git+https://github.com/jose-pr/netimps@standard-alignment"

      # Temporary: pktcap 0.1.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed after netimps because its own requirement is that
      # unpublished netimps. Remove this step once 0.1.0 is published.
      - name: Install pktcap 0.1.0 from its branch (until it is on PyPI)
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,docs,toml]

      - name: Run tests
        run: python -m pytest tests -q -rs

      - name: Check formatting (black)
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        run: python -m black --check src tests benchmarks examples

      # Deliberately on BOTH platforms: typeshed marks POSIX-only socket calls
      # unavailable on Windows, so `sock.recvmsg(...)` is an attr-defined error
      # on one platform while a `# type: ignore` for it is an unused-ignore
      # error on the other. Only checking both catches that.
      - name: Type-check (mypy strict)
        if: matrix.python-version == '3.14'
        run: python -m mypy src

      # Once, on the newest interpreter: the documentation toolchain supports
      # fewer interpreters than the package does.
      - name: Build docs
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        run: python -m mkdocs build --strict

  # The delivery path -- which interface a reply leaves by, what a stock client
  # does with it -- can only be judged against real peers on real links, so this
  # job runs ISC dhclient, BusyBox udhcpc and dnsmasq against the server, relay
  # and client over veth pairs in network namespaces. Everything happens in
  # namespaces the tests create and remove; the runner's own interfaces are not
  # touched. PYDHCP_INTEROP_REQUIRE makes a missing peer, or a runner that
  # refuses `ip netns` under sudo, a failure rather than a green run of skips.
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Temporary: netimps 0.4.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed first, from its branch, so the project install below finds
      # the requirement already met. Remove this step once 0.4.0 is published.
      - name: Install netimps 0.4.0 from its branch (until it is on PyPI)
        run: python -m pip install "netimps @ git+https://github.com/jose-pr/netimps@standard-alignment"

      # Temporary: pktcap 0.1.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed after netimps because its own requirement is that
      # unpublished netimps. Remove this step once 0.1.0 is published.
      - name: Install pktcap 0.1.0 from its branch (until it is on PyPI)
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,toml]

      # dnsmasq-base is the daemon without its system service, which would
      # otherwise start on the runner and bind ports 53 and 67.
      - name: Install the peers
        run: |
          sudo apt-get update
          sudo apt-get install -y isc-dhcp-client dnsmasq-base busybox

      # Ubuntu confines dhclient and dnsmasq with AppArmor profiles written for
      # the system services, which do not allow the temporary directory the
      # tests give them for lease, pid and log files.
      - name: Unload the peers' AppArmor profiles
        run: |
          for profile in sbin.dhclient usr.sbin.dnsmasq; do
            if [ -e "/etc/apparmor.d/$profile" ]; then
              sudo apparmor_parser -R "/etc/apparmor.d/$profile" || true
            fi
          done

      - name: Check the runner can run the lab
        run: |
          command -v dhclient dnsmasq busybox
          busybox --list | grep -x udhcpc
          sudo ip netns add pydhcp-probe
          sudo ip netns exec pydhcp-probe ip link set lo up
          sudo ip netns del pydhcp-probe
          ip netns list

      - name: Run the interoperability tests
        env:
          PYDHCP_INTEROP_REQUIRE: "1"
          PYDHCP_INTEROP_LOGS: ${{ runner.temp }}/interop-logs
        run: sudo --preserve-env "$(command -v python)" -m pytest tests/interop -q -rsx -p no:cacheprovider

      - name: No namespace left behind
        if: always()
        run: |
          test -z "$(ip netns list)"

      # The tests run as root and the peers write their own files, some of
      # them unreadable to the runner's user, which is who uploads.
      - name: Make the logs readable
        if: always()
        run: sudo chmod -R a+rX "${{ runner.temp }}/interop-logs" || true

      - name: Upload what each scenario saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: ${{ runner.temp }}/interop-logs
          if-no-files-found: warn

  benchmark:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_benchmarks) ||
      startsWith(github.ref, 'refs/tags/ci-bench-')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Temporary: netimps 0.4.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed first, from its branch, so the project install below finds
      # the requirement already met. Remove this step once 0.4.0 is published.
      - name: Install netimps 0.4.0 from its branch (until it is on PyPI)
        run: python -m pip install "netimps @ git+https://github.com/jose-pr/netimps@standard-alignment"

      # Temporary: pktcap 0.1.0, which pyproject.toml requires, is not on PyPI
      # yet. Installed after netimps because its own requirement is that
      # unpublished netimps. Remove this step once 0.1.0 is published.
      - name: Install pktcap 0.1.0 from its branch (until it is on PyPI)
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      # --save writes benchmarks/results/<name>.json in the schema
      # tools/compare_bench.py consumes. CI is the only place perf numbers are
      # decision-grade, so this is what a committed baseline should come from.
      - name: Run benchmarks
        run: python benchmarks/run.py --save

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/*.json
