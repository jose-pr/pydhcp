name: Docs

# Owns ALL GitHub Pages deploys. Kept separate from release.yml so the site can
# be rebuilt without cutting a release, and so a release is never the first time
# the docs build runs: release.yml builds the docs strictly as a *gate* and
# creates the release object, and publishing that release fires
# `release: published`, which triggers this workflow to deploy.
#
# Triggers:
#   - release published (a v* release ships its matching docs)
#   - push to main touching docs sources (keeps the site current between releases)
#   - workflow_dispatch (manual redeploy of any ref)
on:
  release:
    types: [published]
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys; never cancel an in-flight Pages deploy mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-build:
    name: Build documentation site
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on for a fresh repo or fork where it was never enabled.
          # Every workflow that builds the docs needs this identically, or the
          # site publishes fine from here and only the release run fails.
          enablement: true

      - name: Install package with docs tooling
        run: python -m pip install -e ".[dev,docs,toml]"

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  docs-deploy:
    name: Deploy documentation to GitHub Pages
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
