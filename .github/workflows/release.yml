name: Release

# Runs when a version tag (e.g. v1.0.0, v1.0.0-rc.1) is pushed. Not wired to
# push/PR events on branches, nor to a manual dispatch with a ref of the
# caller's choosing -- this is a release gate, not general CI.
#
# Test gate and dependency-floor gate, build (checking that the tag names the
# version built), an installed-wheel smoke test, a strict docs build gate, the
# GitHub Release, then -- for final (non pre-release) tags only -- the PyPI
# upload. docs.yml deploys the docs when this workflow completes.
#
# There is no step here that installs netimps or pktcap from a branch, on
# purpose: this workflow must fail while either is unpublished, because a
# release that needed an unpublished dependency could not be installed.
#
# The tag reaches a script only as an environment variable (`env:`), never
# spliced into its source. An expression that only tests it for a `-` is
# evaluated by the runner, not by a shell.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras (dev refers to them)
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests -q -rs

  # The same job test.yml runs: a release must hold at the lowest version of every
  # dependency the manifest claims to support.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Pin every declared dependency to its floor
        run: python .github/pin_floors.py

      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests -q -rs

  build:
    name: Build distribution
    needs: [test, floors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine packaging
      - name: Build sdist and wheel
        run: python -m build
      # A tag on the wrong commit would otherwise publish a release named for
      # one version that carries another version's artifacts.
      - name: The tag names the version that was built
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import sys

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["TAG"]
          want = Version(tag[1:] if tag.startswith("v") else tag)
          dist = pathlib.Path("dist")
          built = {str(parse_wheel_filename(p.name)[1]) for p in dist.glob("*.whl")}
          built |= {str(parse_sdist_filename(p.name)[1]) for p in dist.glob("*.tar.gz")}
          if built != {str(want)}:
              sys.exit("tag %s is version %s, but dist/ holds %s" % (tag, want, sorted(built)))
          print("tag %s matches the built version %s" % (tag, want))
      - name: Verify sdist and wheel
        run: python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # What a user installs is the wheel, not the checkout: install it into a clean
  # environment and check it imports, carries the files it must ship and runs
  # its console script.
  wheel-smoke:
    name: Installed-wheel smoke test (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "$(ls dist/*.whl)"
      - name: Without the cli extra the command says which extra it needs
        run: |
          if "$RUNNER_TEMP/smoke/bin/pydhcp" --help > out.txt 2> err.txt; then
            echo "the command ran without the cli extra"; exit 1
          fi
          cat err.txt
          test ! -s out.txt
          grep -q 'pip install "pydhcp\[cli\]"' err.txt
      - name: Add the cli extra
        run: |
          "$RUNNER_TEMP/smoke/bin/pip" install "$(ls dist/*.whl)[cli]"
      - name: Import it, find the files it must ship, run the console script
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/smoke/bin/pydhcp" --version
          "$RUNNER_TEMP/smoke/bin/pydhcp" interfaces > /dev/null
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          from importlib.resources import files

          import pydhcp

          root = files("pydhcp")
          for name in ("py.typed", "AGENTS.md", "README.md"):
              assert (root / name).is_file(), "the wheel does not ship %s" % name
          print("ok:", pydhcp.__name__)
          PY

  # Docs are DEPLOYED by docs.yml. This job only GATES the release on a strict
  # docs BUILD: a release must never ship if the docs site is broken, but the
  # release path never deploys Pages itself. docs.yml deploys when this workflow
  # completes successfully, from this tag's commit. The site is built from the
  # sources by the docs tooling alone, so nothing of the project is installed.
  docs-gate:
    name: Docs build gate (strict, no deploy)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install the docs tooling
        run: python -m pip install mkdocs mkdocs-material "mkdocstrings[python]"
      - name: Build docs strictly
        run: mkdocs build --strict

  github-release:
    name: Create GitHub Release
    needs: [build, docs-gate, wheel-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG.md section for this tag
        shell: python
        # The tag reaches the script as data (an environment variable), never
        # spliced into its source.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag  # v1.0.0-rc.1 -> 1.0.0-rc.1

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Stop before the next "## [version]" heading, or before the
          # trailing "[version]: https://..." reference-link block at the
          # end of the file (only relevant when this tag is the oldest
          # tracked release, so there's no next heading to stop at).
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        # Pinned to a commit: this action runs with contents: write.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          # A repo that pushes commits directly (no PR flow) gets a thin/empty
          # auto-generated "What's Changed" on every release, not just the
          # first -- the scraped CHANGELOG.md section is the real notes.
          # generate_release_notes still runs and appends its own
          # "Full Changelog: <compare link>" line after body_path's content.
          generate_release_notes: true
          # A tag with a `-` in it (v1.0.0-rc.1) is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md
          # Pin the release object to the tagged commit; left unset it defaults
          # to the default branch.
          target_commitish: ${{ github.sha }}

  # After the GitHub release, and only for a final tag: a PyPI upload is
  # irreversible (a version can never be reused), a GitHub release is not.
  publish-pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pydhcp/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A partially-completed release re-run must not hard-fail on files
          # already uploaded (PyPI never lets a version be replaced); skip them
          # and publish only what's missing. The build job's tag/version check
          # keeps it from masking a wrong tag.
          skip-existing: true
