[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license fields need 1.27
build-backend = "hatchling.build"

[project]
name = "pydhcp"
version = "0.8.0"
authors = [{ name = "jose-pr" }]
description = "A Python DHCP library and server implementation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    # 0.4.0: pydhcp uses the names netimps 0.4 settled on -- UDPEndpoint,
    # has_pktinfo, has_src_pinning, get_interface(index=), split_host,
    # Datagram.destination and truncated, LINK_LOCAL_V4, MACAddress.format --
    # and netimps 0.3 spells them differently, with no alias.
    "netimps>=0.4.0,<0.5",
    # The capture filter grammar and the record writer (one growing file, or one
    # file per record under a name pattern, with a file budget).
    "pktcap>=0.1.0,<0.2",
]

[project.scripts]
pydhcp = "pydhcp.cli:main"

[project.optional-dependencies]
# One extra per capability. `dev` refers to them by name, so a development
# install exercises all of them and no range is written twice.
cli = ['duho>=0.6.0,<0.7']
# PyYAML is 1.0-and-above in spirit (6.x, one API in use: safe_load and
# safe_dump), so it is major-scoped. The floor is the lowest release that
# installs: 6.0 has wheels only for Python 3.9 to 3.11 and none for Windows on
# ARM64, and from source it does not build (it needs a Cython older than the one
# a build gets), so there the floor is 6.0.1, which builds from source.
yaml = [
    'PyYAML>=6.0,<7; python_version < "3.12" and (sys_platform != "win32" or platform_machine != "ARM64")',
    'PyYAML>=6.0.1,<7; python_version >= "3.12" or (sys_platform == "win32" and platform_machine == "ARM64")',
]
# tomli-w: dumps(); tomli: loads() and TOMLDecodeError; both present in these floors.
toml = ['tomli-w>=1.0,<2', 'tomli>=2.0,<3; python_version < "3.11"']
dev = ['pydhcp[cli,yaml,toml]', 'black', 'build', 'twine', 'hatchling', 'mypy', 'pip-audit', 'pytest', 'pytest-cov', 'hypothesis>=6.100']
docs = ['mkdocs', 'mkdocs-material', 'mkdocstrings[python]']

[project.urls]
Homepage = "https://github.com/jose-pr/pydhcp/"
Documentation = "https://jose-pr.github.io/pydhcp/"
Issues = "https://github.com/jose-pr/pydhcp/issues"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/pydhcp/AGENTS.md is included automatically by living in the package
# dir; the repo-root AGENTS.md is development-only and deliberately not
# shipped.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "pydhcp/README.md"

[tool.hatch.build.targets.sdist]
# Personal overrides (`*.local.*`) and agent config (`CLAUDE*`) never ship, even
# from a tree without its `.gitignore` (a copy, or a checkout under a directory
# whose name that file lists, where the backend drops every rule it holds). Neither
# does the repository root's `AGENTS.md`, which orients a contributor in a checkout:
# the header a consumer reads is `src/pydhcp/AGENTS.md`, which does ship. Benchmarks
# are run on demand from a checkout; their results record the machine they ran on.
exclude = ["/.*", "/AGENTS.md", "/benchmarks", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
exclude = ["*.local.*", "CLAUDE*"]

[tool.pytest.ini_options]
# "tests" so the helpers in tests/conftest.py can be imported by name from
# tests/integration/ as well, rather than relying on collection order to have
# put tests/ on sys.path first.
pythonpath = ["src", "tests"]
testpaths = ["tests"]
# A warning is a failure: an unclosed socket or file, an un-awaited coroutine or a
# deprecation in a dependency stops the run instead of scrolling past. A needed
# exception is listed here as narrowly as the warning's own text, with its reason.
filterwarnings = ["error"]
# An expected failure that passes is a failure, so the fix removes its marker.
xfail_strict = true

[tool.black]
# The project's *minimum* Python, so black never emits syntax the floor cannot
# parse -- deliberately not the version it is run with.
target-version = ["py39"]

[tool.mypy]
# NOT the project's floor, which is 3.9: mypy 2.x refuses --python-version below
# 3.10 outright ("Python 3.9 is not supported"), so this is the lowest value it
# accepts, not a choice. Static checking therefore uses 3.10 semantics while the
# floor is verified by actually running the suite on 3.9, which the test matrix
# and release gate both do. Do not "fix" this to 3.9; mypy will refuse to start.
# Owner decision, 2026-09-18: keep the 3.9 floor, check types at >=3.10.
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
# Since it is a library, make sure it is fully type checked
