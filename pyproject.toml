[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydhcp"
version = "0.5.2"
authors = [{ name = "jose-pr" }]
description = "A Python DHCP library and server implementation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
    "netimps>=0.2.0,<0.3",
    "duho>=0.5.0,<0.6",
]

[project.scripts]
pydhcp = "pydhcp.cli:main"

[project.optional-dependencies]
dev = ['black', 'build', 'twine', 'hatchling', 'mypy', 'pip-audit', 'pytest', 'pytest-cov', 'hypothesis>=6.100']
docs = ['mkdocs', 'mkdocs-material', 'mkdocstrings[python]']
toml = ['tomli-w>=1.2.0', 'tomli>=2.4.0; python_version < "3.11"']

[project.urls]
Homepage = "https://github.com/jose-pr/pydhcp/"
Documentation = "https://jose-pr.github.io/pydhcp/"
Issues = "https://github.com/jose-pr/pydhcp/issues"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/pydhcp/AGENTS.md is included automatically by living in the package
# dir; the repo-root AGENTS.md is development-only and deliberately not
# shipped.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "pydhcp/README.md"

[tool.hatch.build.targets.sdist]
# "*.local.*" is not covered by "/.*": the name does not start with a dot, so a
# personal override such as src/pydhcp/settings.local.json shipped to PyPI --
# where it cannot be recalled -- carrying one machine's paths or hostnames.
#
# benchmarks/results/ is tracked in git (that is what makes a before/after
# comparison recoverable from history) but has no business in a release: the
# files are machine-identifying by design -- each records the host CPU string
# and OS build it was measured on -- and mean nothing to a consumer.
exclude = ["/.*", "*.local.*", "/benchmarks/results"]

[tool.hatch.build.targets.wheel]
exclude = ["*.local.*"]

[tool.pytest.ini_options]
# "tests" so the helpers in tests/conftest.py can be imported by name from
# tests/integration/ as well, rather than relying on collection order to have
# put tests/ on sys.path first.
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.black]
# The project's *minimum* Python, so black never emits syntax the floor cannot
# parse -- deliberately not the version it is run with.
target-version = ["py39"]

[tool.mypy]
# NOT the project's floor, which is 3.9: mypy 2.x refuses --python-version below
# 3.10 outright ("Python 3.9 is not supported"), so this is the lowest value it
# accepts, not a choice. Static checking therefore uses 3.10 semantics while the
# floor is verified by actually running the suite on 3.9, which the test matrix
# and release gate both do. Do not "fix" this to 3.9; mypy will refuse to start.
# Owner decision, 2026-09-18: keep the 3.9 floor, check types at >=3.10.
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
# Since it is a library, make sure it is fully type checked
